<header>
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
        <h5 class="my-0 mr-md-auto font-weight-normal">EasyMailer</h5>
        <nav class="ms-5">
            <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:main' %}">Главная</a>
            {% if user.is_authenticated %}
                <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:subscriber_list' %}">Клиенты</a>
                <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:message_list' %}">Сообщения</a>
                <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:campaign_list' %}">Рассылки</a>
                <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:contacts' %}">Контакты</a>
            {% endif %}
        </nav>
        <nav class="ms-auto ms-5 ">
            {% if user.is_authenticated %}
                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <a class="p-2 btn btn-outline-primary" href="{% url 'users:profile' %}">Профиль</a>
                    <button type="submit" class="btn btn-outline-primary">Выйти</button>
                </form>
            {% else %}
                <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
                <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Войти</a>
            {% endif %}
        </nav>
    </div>
</header>
