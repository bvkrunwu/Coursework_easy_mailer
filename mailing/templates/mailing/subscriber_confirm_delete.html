{% extends 'mailing/base.html' %}

{% block title %}Удаление клиента{% endblock %}

{% block content %}
    <main class="flex-shrink-0">
        <div class="container">
            <h1 class="mt-5">Удаление клиента</h1>
            <p class="lead"></p>
            <div class="row mb-2">
                <div class="col-md-12">
                    <div class="container">
                        <div class="row">
                            <div class="col">
                                <form class="row" method="post" enctype="multipart/form-data">
                                    <div class="card">
                                        <p class="card-text">Вы действительно хотите удалить клиента:
                                            "{{ object.full_name }}"</p>
                                        <div class="card-body">
                                            {% csrf_token %}
                                        </div>
                                        <div class="row mb-2">
                                            <div class="col-md-12">
                                                <button type="submit" class="btn btn-outline-danger btn-sm">Удалить</button>
                                                <a class="btn btn-outline-secondary btn-sm" href="{% url 'mailing:subscriber_list' %}"
                                                   role="button">Отменить</a>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
